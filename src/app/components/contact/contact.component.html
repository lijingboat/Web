<section id="application-contact-section" [class]="Settings().sectionClass">
  <div id="application-contact-container" [class]="Settings().containerClass">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 text-center">
        <h2 id="application-contact-title">{{ Settings().title }}</h2>
        <p id="application-contact-content">{{ Settings().content }}</p>
      </div>
    </div>
  </div>
</section>
