<section id="application-contact-section" [class]="Settings().sectionClass + ' application-configured-section'" [style.background-color]="Settings().style.backgroundColor" [style.color]="Settings().style.textColor" [style.font-family]="Settings().style.fontFamily" [style.font-size]="Settings().style.fontSize">
  <div id="application-contact-container" [class]="Settings().containerClass">
    <div id="application-contact-heading" class="row justify-content-center mb-4">
      <div class="col-12 col-lg-8 text-center">
        <p id="application-contact-kicker" class="text-uppercase small fw-semibold text-primary mb-2">Start a conversation</p>
        <h1 id="application-contact-title" class="display-6" [style.color]="Settings().style.headingColor">{{ Settings().title }}</h1>
        <p id="application-contact-content" class="lead text-body-secondary mb-0">{{ Settings().content }}</p>
      </div>
    </div>
    <div id="application-contact-details" class="row g-4">
      <div class="col-12 col-lg-5">
        <article id="application-contact-details-card" class="border bg-white p-4 h-100 rounded-2">
          <h2 id="application-contact-details-title" class="h4">Sample contact details</h2>
          <dl id="application-contact-details-list" class="mb-0">
            <dt id="application-contact-details-phone-label" class="mt-3">Phone</dt>
            <dd id="application-contact-details-phone-value" class="text-body-secondary">+1 555 010 0200</dd>
            <dt id="application-contact-details-email-label">Email</dt>
            <dd id="application-contact-details-email-value" class="text-body-secondary">hello@example.test</dd>
            <dt id="application-contact-details-hours-label">Hours</dt>
            <dd id="application-contact-details-hours-value" class="text-body-secondary mb-0">Daily, 8:00 AM to 8:00 PM</dd>
          </dl>
        </article>
      </div>
      <div class="col-12 col-lg-7">
        <form id="application-contact-form" class="border bg-white p-4 rounded-2" action="#application-contact-form" method="get">
          <h2 id="application-contact-form-title" class="h4">Send a sample inquiry</h2>
          <div class="row g-3">
            <div class="col-12 col-md-6"><label for="application-contact-name" class="form-label">Name</label><input id="application-contact-name" class="form-control" name="name" type="text"></div>
            <div class="col-12 col-md-6"><label for="application-contact-email" class="form-label">Email</label><input id="application-contact-email" class="form-control" name="email" type="email"></div>
            <div class="col-12"><label for="application-contact-message" class="form-label">Message</label><textarea id="application-contact-message" class="form-control" name="message" rows="4"></textarea></div>
            <div class="col-12"><button id="application-contact-submit" class="btn btn-primary" type="submit">Send inquiry</button></div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
